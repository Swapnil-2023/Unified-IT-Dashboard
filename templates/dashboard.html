<!DOCTYPE html>
<html>
<head>
    <title>Dashboard</title>
</head>
<body>

<h1>Unified IT Dashboard</h1>

<h2>📊 Stats</h2>
<div id="stats"></div>

<h2>🖥️ Server Health</h2>
<div id="monitoring"></div>

<h2>🌡️ Server Room Weather</h2>
<div id="iot"></div>

<h2>🖥️ Asset Management</h2>

<input type="text" id="assetName" placeholder="assetName">
<input type="text" id="assetType" placeholder="Asset assetType">
<button onclick="addAsset()">Add Asset</button>
<select id="userSelect"></select>
<select id="vendorSelect"></select>

<ul id="assetList"></ul>

<h2>👤 Users</h2>

<input type="text" id="userName" placeholder="Name">
<input type="text" id="userEmail" placeholder="Email">
<input type="text" id="userPassword" placeholder="Password">
<input type="text" id="userRole" placeholder="Role">

<button onclick="addUser()">Add User</button>

<ul id="userList"></ul>

<h2>🎫 Ticket System</h2>

<input type="text" id="ticketTitle" placeholder="Ticket Title">
<input type="text" id="ticketPriority" placeholder="Priority (High/Medium/Low)">
<button onclick="addTicket()">Create Ticket</button>

<ul id="ticketList"></ul>

<h2>🏢 Vendor Management</h2>

<input type="text" id="vendorName" placeholder="Vendor Name">
<input type="text" id="vendorContact" placeholder="Contact">
<input type="text" id="vendorEmail" placeholder="Email">
<button onclick="addVendor()">Add Vendor</button>

<ul id="vendorList"></ul>

<h2>📁 Document Upload</h2>

<input type="file" id="fileInput">
<select id="fileType">
    <option value="Invoice">Invoice</option>
    <option value="PO">PO</option>
    <option value="Quotation">Quotation</option>
</select>
<select id="docAsset"></select>
<select id="docVendor"></select>

<button onclick="uploadFile()">Upload</button>

<ul id="docList"></ul>

<script>
function loadData() {
    fetch('/dashboard/stats')
    .then(res => res.json())
    .then(data => {
        document.getElementById('stats').innerText =
            `Assets: ${data.assets}, Users: ${data.users}, Open Tickets: ${data.tickets_open}, Closed Tickets: ${data.tickets_closed}`;
    });

    fetch('/dashboard/monitoring')
    .then(res => res.json())
    .then(data => {
        document.getElementById('monitoring').innerText =
            `CPU: ${data.cpu}%, RAM: ${data.ram}%, Disk: ${data.disk}%`;
    });

    fetch('/dashboard/iot')
    .then(res => res.json())
    .then(data => {
        document.getElementById('iot').innerText =
            `Temp: ${data.temperature}°C, Humidity: ${data.humidity}%`;
    });
}

loadData();
setInterval(loadData, 5000); // refresh every 5 sec
</script>

<script>
function loadAssets() {
    fetch('/assets')
    .then(res => res.json())
    .then(data => {
        let list = document.getElementById('assetList');
        list.innerHTML = "";

        let docAssetSelect = document.getElementById('docAsset');
        if (docAssetSelect) docAssetSelect.innerHTML = "";

        data.forEach(asset => {
            let li = document.createElement('li');
            li.innerText = `${asset.name} (${asset.type}) - ${asset.status}`;
            list.appendChild(li);
            li.innerHTML = `${asset.name} (${asset.type}) - ${asset.status}
            <button onclick="deleteAsset(${asset.id})">Delete</button>`;

            if (docAssetSelect) {
                let option = document.createElement('option');
                option.value = asset.id;
                option.text = asset.name;
                docAssetSelect.appendChild(option);
            }
        });
    });
}

function addAsset() {
    let name = document.getElementById('assetName').value;
    let type = document.getElementById('assetType').value;
    let user_id = document.getElementById('userSelect').value;
    let vendor_id = document.getElementById('vendorSelect').value;

    fetch('/assets', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name: name, type: type, assigned_user_id: user_id, vendor_id: vendor_id})
    })
    .then(res => res.json())
    .then(data => {
        console.log(data);
        loadAssets();
    })
    .catch(err => console.error("Error:", err));
}

function deleteAsset(id) {
    fetch(`/assets/${id}`, {
        method: 'DELETE'
    })
    .then(() => loadAssets());
}

loadAssets();
</script>

<script>
function loadTickets() {
    fetch('/tickets')
    .then(res => res.json())
    .then(data => {
        let list = document.getElementById('ticketList');
        list.innerHTML = "";

        data.forEach(ticket => {
    let li = document.createElement('li');

    let actionButton = "";

    if (ticket.status === "Open") {
        actionButton = `<button onclick="toggleTicket(${ticket.id})">Close</button>`;
    } else {
        actionButton = `<button onclick="toggleTicket(${ticket.id})">Open</button>`;
    }

    li.innerHTML = `
        ${ticket.title} (${ticket.priority}) - ${ticket.status}
        ${actionButton}
        <button onclick="deleteTicket(${ticket.id})">Delete</button>
    `;

    list.appendChild(li);
});
    });
}

function addTicket() {
    let title = document.getElementById('ticketTitle').value;
    let priority = document.getElementById('ticketPriority').value;

    fetch('/tickets', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ title: title, priority: priority })
    })
    .then(res => res.json())
    .then(() => {
        loadTickets();
    });
}

function toggleTicket(id) {
    fetch(`/tickets/${id}`, {
        method: 'PUT'
    })
    .then(() => {
        loadTickets();
        loadData();
    });
}

function deleteTicket(id) {
    fetch(`/tickets/${id}`, {
        method: 'DELETE'
    })
    .then(() => {
        loadTickets();
        loadData(); // update dashboard stats
    });
}

// Load on page start
loadTickets();
</script>

<script>
function loadVendors() {
    fetch('/vendors')
    .then(res => res.json())
    .then(data => {
        let list = document.getElementById('vendorList');
        list.innerHTML = "";
        let assetVendorSelect = document.getElementById('vendorSelect');
        let docVendorSelect = document.getElementById('docVendor');
        
        if (assetVendorSelect) assetVendorSelect.innerHTML = "";
        if (docVendorSelect) docVendorSelect.innerHTML = "";

        data.forEach(v => {
            let li = document.createElement('li');
            li.innerText = `${v.name} (${v.contact}) - ${v.email}`;
            list.appendChild(li);
            li.innerHTML = `${v.name} (${v.contact}) - ${v.email}
            <button onclick="deleteVendor(${v.id})">Delete</button>`;

            // 🔽 ADD THIS BLOCK
            if (assetVendorSelect) {
                let option = document.createElement('option');
                option.value = v.id;
                option.text = v.name;
                assetVendorSelect.appendChild(option);
            }
            
            if (docVendorSelect) {
                let option = document.createElement('option');
                option.value = v.id;
                option.text = v.name;
                docVendorSelect.appendChild(option);
            }
        });
    });
}

function addVendor() {
    let name = document.getElementById('vendorName').value;
    let contact = document.getElementById('vendorContact').value;
    let email = document.getElementById('vendorEmail').value;

    fetch('/vendors', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name, contact, email })
    })
    .then(() => loadVendors());
}

function deleteVendor(id) {
    fetch(`/vendors/${id}`, { method: 'DELETE' })
    .then(() => loadVendors());
}

loadVendors();
</script>

<script>
function uploadFile() {
    let file = document.getElementById('fileInput').files[0];
    let type = document.getElementById('fileType').value;
    let asset_id = document.getElementById('docAsset').value;
    let vendor_id = document.getElementById('docVendor').value;

    let formData = new FormData();
    formData.append('file', file);
    formData.append('type', type);
    formData.append('asset_id', asset_id);
    formData.append('vendor_id', vendor_id);

    fetch('/upload', {
        method: 'POST',
        body: formData
    })
    .then(() => loadDocuments())
    .catch(err => console.error("Upload Error:", err));
}

function loadDocuments() {
    fetch('/documents')
    .then(res => res.json())
    .then(data => {
        let list = document.getElementById('docList');
        list.innerHTML = "";

        data.forEach(doc => {
            let li = document.createElement('li');
            li.innerText = `${doc.name} (${doc.type})`;
            list.appendChild(li);
            li.innerHTML = `${doc.name} (${doc.type})
            <button onclick="deleteDocument(${doc.id})">Delete</button>`;
        });
    });
}

function deleteDocument(id) {
    console.log("Deleting ID:", id); // DEBUG
    fetch(`/documents/${id}`, { method: 'DELETE' })
    .then(() => loadDocuments());
}

loadDocuments();
</script>

<script>
function loadUsers() {
    fetch('/users')
    .then(res => res.json())
    .then(data => {
        let list = document.getElementById('userList');
        let select = document.getElementById('userSelect');

        list.innerHTML = "";
        select.innerHTML = "";

        data.forEach(u => {
            let li = document.createElement('li');
            li.innerHTML = `
            ${u.name} (${u.role})
            <button onclick="deleteUser(${u.id})">Delete</button>
            `;
            list.appendChild(li);

            let option = document.createElement('option');
            option.value = u.id;
            option.text = u.name;
            select.appendChild(option);
        });
    });
}

function addUser() {
    let name = document.getElementById('userName').value;
    let email = document.getElementById('userEmail').value;
    let password = document.getElementById('userPassword').value;
    let role = document.getElementById('userRole').value;

    fetch('/users', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },  // ✅ FIXED
        body: JSON.stringify({ name, email, password, role })
    })
    .then(() => loadUsers())
    .catch(err => console.error("User Error:", err));  // optional debug
}

function deleteUser(id) {
    fetch(`/users/${id}`, {
        method: 'DELETE'
    })
    .then(() => loadUsers());
}
loadUsers();
</script>

</body>
</html>
