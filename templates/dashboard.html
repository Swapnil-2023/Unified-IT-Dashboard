<!DOCTYPE html>
<html>
<head>
    <title>Dashboard</title>
    
    <style>
    body {
        font-family: Arial, sans-serif;
        background: #f4f6f9;
        margin: 20px;
    }

    h1 {
        text-align: center;
    }

    .section {
        background: white;
        padding: 15px;
        margin: 20px auto;
        max-width: 800px;
        border-radius: 10px;
        box-shadow: 0 2px 6px rgba(0,0,0,0.1);
    }

    h2 {
        margin-top: 0;
    }

    button {
        margin-left: 5px;
        padding: 5px 10px;
        cursor: pointer;
    }

    input, select {
        margin: 5px;
        padding: 5px;
    }

    </style>
</head>
<body>

<h1>Unified IT Dashboard</h1>

<div class="section">
    <h2>📊 Stats</h2>
    <div id="stats"></div>
</div>

<div class="section">
    <h2>🖥️ Server Health</h2>
    <div id="monitoring"></div>
</div>

<div class="section">
    <h2>🌡️ Server Room Weather</h2>
    <div id="iot"></div>
</div>

<div class="section">
    <h2>🖥️ Asset Management</h2>

    <input type="text" id="assetName" placeholder="Asset Name">
    <input type="text" id="assetType" placeholder="Asset Type">
    <select id="userSelect"></select>
    <select id="vendorSelect"></select>
    <button onclick="addAsset()">Add Asset</button>

    <ul id="assetList"></ul>

    <button onclick="loadDocuments()">Show All Documents</button>
</div>

<div class="section">
    <h2>👤 Users</h2>

    <input type="text" id="userName" placeholder="Name">
    <input type="text" id="userEmail" placeholder="Email">
    <input type="text" id="userPassword" placeholder="Password">
    <input type="text" id="userRole" placeholder="Role">

    <button onclick="addUser()">Add User</button>

    <ul id="userList"></ul>
</div>

<div class="section">
    <h2>🎫 Ticket System</h2>

    <input type="text" id="ticketTitle" placeholder="Ticket Title">
    <input type="text" id="ticketPriority" placeholder="Priority (High/Medium/Low)">
    <button onclick="addTicket()">Create Ticket</button>

    <ul id="ticketList"></ul>
</div>

<div class="section">
    <h2>🏢 Vendor Management</h2>

    <input type="text" id="vendorName" placeholder="Vendor Name">
    <input type="text" id="vendorContact" placeholder="Contact">
    <input type="text" id="vendorEmail" placeholder="Email">
    <button onclick="addVendor()">Add Vendor</button>

    <ul id="vendorList"></ul>
</div>

<div class="section">
    <h2>📁 Document Upload</h2>

    <input type="file" id="fileInput">
    <select id="fileType">
        <option value="Invoice">Invoice</option>
        <option value="PO">PO</option>
        <option value="Quotation">Quotation</option>
    </select>
    <select id="docAsset" onchange="filterVendorByAsset()"></select>
    <select id="docVendor"></select>

    <button onclick="uploadFile()">Upload</button>

    <ul id="docList"></ul>
</div>

<script>
function loadData() {
    fetch('/dashboard/stats')
    .then(res => res.json())
    .then(data => {
        document.getElementById('stats').innerText =
            `Assets: ${data.assets}, Users: ${data.users}, Open Tickets: ${data.tickets_open}, Closed Tickets: ${data.tickets_closed}`;
    });

    fetch('/dashboard/monitoring')
    .then(res => res.json())
    .then(data => {
        document.getElementById('monitoring').innerText =
            `CPU: ${data.cpu}%, RAM: ${data.ram}%, Disk: ${data.disk}%`;
    });

    fetch('/dashboard/iot')
    .then(res => res.json())
    .then(data => {
        document.getElementById('iot').innerText =
            `Temp: ${data.temperature}°C, Humidity: ${data.humidity}%`;
    });
}

loadData();
setInterval(loadData, 5000); // refresh every 5 sec
</script>

<script>
    let allAssets = [];
    let allVendors = [];

function loadAssets() {
    fetch('/assets')
    .then(res => res.json())
    .then(data => {
        allAssets = data;

        let assetMap = {};
        let list = document.getElementById('assetList');
        list.innerHTML = "";

        let docAssetSelect = document.getElementById('docAsset');
        if (docAssetSelect) docAssetSelect.innerHTML = "";

        data.forEach(asset => {
            assetMap[asset.id] = asset;

            let li = document.createElement('li');
            
            // ✅ Asset display with relationships
            li.innerHTML = `
                <span onclick="filterDocumentsByAsset(${asset.id})" style="cursor:pointer; color:blue; font-weight:bold;">
                    ${asset.name}
                </span>
                (${asset.type}) - ${asset.status}
                | 👤 User: ${asset.user_name}
                | 🏢 Vendor: ${asset.vendor_name}
                <button onclick="deleteAsset(${asset.id})">Delete</button>
            `;
            
            list.appendChild(li);
            
            // ✅ Keep dropdown population (IMPORTANT)
             
            if (docAssetSelect) {
                let option = document.createElement('option');
                option.value = asset.id;
                option.text = asset.name;
                docAssetSelect.appendChild(option);
            }
        });
    });
}

function addAsset() {
    let name = document.getElementById('assetName').value;
    let type = document.getElementById('assetType').value;
    let user_id = document.getElementById('userSelect').value;
    let vendor_id = document.getElementById('vendorSelect').value;

    fetch('/assets', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name: name, type: type, assigned_user_id: user_id, vendor_id: vendor_id})
    })
    .then(res => res.json())
    .then(data => {
        console.log(data);
        loadAssets();
        loadDocuments();
    })
    .catch(err => console.error("Error:", err));
}

function deleteAsset(id) {
    fetch(`/assets/${id}`, {
        method: 'DELETE'
    })
    .then(() => {
        loadAssets();
        loadDocuments();  // 🔥 keep UI in sync
    });
}


loadAssets();
</script>

<script>
function loadTickets() {
    fetch('/tickets')
    .then(res => res.json())
    .then(data => {
        let list = document.getElementById('ticketList');
        list.innerHTML = "";

        data.forEach(ticket => {
    let li = document.createElement('li');

    let actionButton = "";

    if (ticket.status === "Open") {
        actionButton = `<button onclick="toggleTicket(${ticket.id})">Close</button>`;
    } else {
        actionButton = `<button onclick="toggleTicket(${ticket.id})">Open</button>`;
    }

    li.innerHTML = `
        ${ticket.title} (${ticket.priority}) - ${ticket.status}
        ${actionButton}
        <button onclick="deleteTicket(${ticket.id})">Delete</button>
    `;

    list.appendChild(li);
});
    });
}

function addTicket() {
    let title = document.getElementById('ticketTitle').value;
    let priority = document.getElementById('ticketPriority').value;

    fetch('/tickets', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ title: title, priority: priority })
    })
    .then(res => res.json())
    .then(() => {
        loadTickets();
    });
}

function toggleTicket(id) {
    fetch(`/tickets/${id}`, {
        method: 'PUT'
    })
    .then(() => {
        loadTickets();
        loadData();
    });
}

function deleteTicket(id) {
    fetch(`/tickets/${id}`, {
        method: 'DELETE'
    })
    .then(() => {
        loadTickets();
        loadData(); // update dashboard stats
    });
}

// Load on page start
loadTickets();
</script>

<script>
function loadVendors() {
    fetch('/vendors')
    .then(res => res.json())
    .then(data => {
        allVendors = data; // ✅ store globally

        let list = document.getElementById('vendorList');
        list.innerHTML = "";
        let assetVendorSelect = document.getElementById('vendorSelect');
        let docVendorSelect = document.getElementById('docVendor');
        
        if (assetVendorSelect) assetVendorSelect.innerHTML = "";
        if (docVendorSelect) docVendorSelect.innerHTML = "";

        data.forEach(v => {
            let li = document.createElement('li');
            li.innerText = `${v.name} (${v.contact}) - ${v.email}`;
            list.appendChild(li);
            li.innerHTML = `${v.name} (${v.contact}) - ${v.email}
            <button onclick="deleteVendor(${v.id})">Delete</button>`;

            // 🔽 ADD THIS BLOCK
            if (assetVendorSelect) {
                let option = document.createElement('option');
                option.value = v.id;
                option.text = v.name;
                assetVendorSelect.appendChild(option);
            }
            
            if (docVendorSelect) {
                let option = document.createElement('option');
                option.value = v.id;
                option.text = v.name;
                docVendorSelect.appendChild(option);
            }
        });
    });
}

function addVendor() {
    let name = document.getElementById('vendorName').value;
    let contact = document.getElementById('vendorContact').value;
    let email = document.getElementById('vendorEmail').value;

    fetch('/vendors', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name, contact, email })
    })
    .then(() => loadVendors());
}

function deleteVendor(id) {
    fetch(`/vendors/${id}`, { method: 'DELETE' })
    .then(() => loadVendors());
}

loadVendors();

function filterVendorByAsset() {
    let selectedAssetId = document.getElementById('docAsset').value;

    let docVendorSelect = document.getElementById('docVendor');
    docVendorSelect.innerHTML = "";

    let selectedAsset = allAssets.find(a => a.id == selectedAssetId);

    if (!selectedAsset) return;

    // Find matching vendor
    let vendor = allVendors.find(v => v.id == selectedAsset.vendor_id);

    if (vendor) {
        let option = document.createElement('option');
        option.value = vendor.id;
        option.text = vendor.name;
        docVendorSelect.appendChild(option);
    }
}

</script>

<script>
    let allDocuments = [];

function uploadFile() {
    let file = document.getElementById('fileInput').files[0];
    let type = document.getElementById('fileType').value;
    let asset_id = document.getElementById('docAsset').value;
    let vendor_id = document.getElementById('docVendor').value;

    let formData = new FormData();
    formData.append('file', file);
    formData.append('type', type);
    formData.append('asset_id', asset_id);
    formData.append('vendor_id', vendor_id);

    fetch('/upload', {
        method: 'POST',
        body: formData
    })
    .then(() => loadDocuments())
    .catch(err => console.error("Upload Error:", err));
}

function loadDocuments() {
    fetch('/documents')
    .then(res => res.json())
    .then(data => {
        allDocuments = data;

        let list = document.getElementById('docList');
        list.innerHTML = "";

        data.forEach(doc => {
            let li = document.createElement('li');
            
            li.innerHTML = `
                <span onclick="selectDocument(${doc.id})" style="cursor:pointer; color:green; font-weight:bold;">
                    ${doc.name}
                </span>

                (${doc.type})
                | 🖥️ ${doc.asset_name || "N/A"}
                | 🏢 ${doc.vendor_name || "N/A"}
                <button onclick="deleteDocument(${doc.id})">Delete</button>
            `;
                
            list.appendChild(li);
        });
    });
}

function deleteDocument(id) {
    console.log("Deleting ID:", id); // DEBUG
    fetch(`/documents/${id}`, { method: 'DELETE' })
    .then(() => loadDocuments());
}

loadDocuments();

function filterDocumentsByAsset(assetId) {
    let list = document.getElementById('docList');
    list.innerHTML = "";

    let filteredDocs = allDocuments.filter(doc => doc.asset_id == assetId);

    filteredDocs.forEach(doc => {
        let li = document.createElement('li');

        li.innerHTML = `
            ${doc.name} (${doc.type})
            | 🖥️ ${doc.asset_name || "N/A"}
            | 🏢 ${doc.vendor_name || "N/A"}
            <button onclick="deleteDocument(${doc.id})">Delete</button>
        `;

        list.appendChild(li);
    });
}

function selectDocument(docId) {
    let doc = allDocuments.find(d => d.id == docId);

    if (!doc) return;

    // 🎯 Auto-select Asset
    let assetSelect = document.getElementById('docAsset');
    assetSelect.value = doc.asset_id;

    // 🎯 Trigger vendor filter (important)
    filterVendorByAsset();

    // 🎯 Auto-select Vendor
    let vendorSelect = document.getElementById('docVendor');
    vendorSelect.value = doc.vendor_id;
}

</script>

<script>
function loadUsers() {
    fetch('/users')
    .then(res => res.json())
    .then(data => {
        let list = document.getElementById('userList');
        let select = document.getElementById('userSelect');

        list.innerHTML = "";
        select.innerHTML = "";

        data.forEach(u => {
            let li = document.createElement('li');
            li.innerHTML = `
            ${u.name} (${u.role})
            <button onclick="deleteUser(${u.id})">Delete</button>
            `;
            list.appendChild(li);

            let option = document.createElement('option');
            option.value = u.id;
            option.text = u.name;
            select.appendChild(option);
        });
    });
}

function addUser() {
    let name = document.getElementById('userName').value;
    let email = document.getElementById('userEmail').value;
    let password = document.getElementById('userPassword').value;
    let role = document.getElementById('userRole').value;

    fetch('/users', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },  // ✅ FIXED
        body: JSON.stringify({ name, email, password, role })
    })
    .then(() => loadUsers())
    .catch(err => console.error("User Error:", err));  // optional debug
}

function deleteUser(id) {
    fetch(`/users/${id}`, {
        method: 'DELETE'
    })
    .then(() => loadUsers());
}
loadUsers();
</script>

</body>
</html>
