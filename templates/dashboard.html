<!DOCTYPE html>
<html>
<head>
    <title>Dashboard</title>
</head>
<body>

<h1>Unified IT Dashboard</h1>

<h2>📊 Stats</h2>
<div id="stats"></div>

<h2>🖥️ Monitoring</h2>
<div id="monitoring"></div>

<h2>🌡️ Environment</h2>
<div id="iot"></div>

<h2>🖥️ Asset Management</h2>

<input type="text" id="assetName" placeholder="assetName">
<input type="text" id="assetType" placeholder="Asset assetType">
<button onclick="addAsset()">Add Asset</button>

<ul id="assetList"></ul>

<h2>🎫 Ticket System</h2>

<input type="text" id="ticketTitle" placeholder="Ticket Title">
<input type="text" id="ticketPriority" placeholder="Priority (High/Medium/Low)">
<button onclick="addTicket()">Create Ticket</button>

<ul id="ticketList"></ul>

<script>
function loadData() {
    fetch('/dashboard/stats')
    .then(res => res.json())
    .then(data => {
        document.getElementById('stats').innerText =
            `Assets: ${data.assets}, Open Tickets: ${data.tickets_open}, Closed Tickets: ${data.tickets_closed}`;
    });

    fetch('/dashboard/monitoring')
    .then(res => res.json())
    .then(data => {
        document.getElementById('monitoring').innerText =
            `CPU: ${data.cpu}%, RAM: ${data.ram}%, Disk: ${data.disk}%`;
    });

    fetch('/dashboard/iot')
    .then(res => res.json())
    .then(data => {
        document.getElementById('iot').innerText =
            `Temp: ${data.temperature}°C, Humidity: ${data.humidity}%`;
    });
}

loadData();
setInterval(loadData, 5000); // refresh every 5 sec
</script>

<script>
function loadAssets() {
    fetch('/assets')
    .then(res => res.json())
    .then(data => {
        let list = document.getElementById('assetList');
        list.innerHTML = "";

        data.forEach(asset => {
            let li = document.createElement('li');
            li.innerText = `${asset.name} (${asset.type}) - ${asset.status}`;
            list.appendChild(li);
        });
    });
}

function addAsset() {
    let name = document.getElementById('assetName').value;
    let type = document.getElementById('assetType').value;

    fetch('/assets', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name: name, type: type })
    })
    .then(res => res.json())
    .then(data => {
        console.log(data);
        loadAssets();
    })
    .catch(err => console.error("Error:", err));
}

loadAssets();
</script>

<script>
function loadTickets() {
    fetch('/tickets')
    .then(res => res.json())
    .then(data => {
        let list = document.getElementById('ticketList');
        list.innerHTML = "";

        data.forEach(ticket => {
            let li = document.createElement('li');

            li.innerHTML = `
                ${ticket.title} (${ticket.priority}) - ${ticket.status}
                <button onclick="closeTicket(${ticket.id})">Close</button>
            `;

            list.appendChild(li);
        });
    });
}

function addTicket() {
    let title = document.getElementById('ticketTitle').value;
    let priority = document.getElementById('ticketPriority').value;

    fetch('/tickets', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ title: title, priority: priority })
    })
    .then(res => res.json())
    .then(() => {
        loadTickets();
    });
}

function closeTicket(id) {
    fetch(`/tickets/${id}`, {
        method: 'PUT'
    })
    .then(() => {
        loadTickets();
    });
}

// Load on page start
loadTickets();
</script>

</body>
</html>
